<div class="language-switcher">
  <button 
    mat-button 
    [class.active]="currentLanguage === 'pt'"
    (click)="switchLanguage('pt')"
    aria-label="Português">
    🇧🇷 PT
  </button>
  <button 
    mat-button 
    [class.active]="currentLanguage === 'en'"
    (click)="switchLanguage('en')"
    aria-label="English">
    🇺🇸 EN
  </button>
</div>
